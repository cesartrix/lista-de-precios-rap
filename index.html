<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Precios por Proveedor y Marca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="container mx-auto max-w-7xl p-6">
        <div class="w-full flex justify-center mb-6 bg-white p-4 rounded-xl shadow-xs border border-gray-200">
            <img id="logoBanner" src="https://i.postimg.cc/MnxJSvgf/image-dda983.jpg" alt="Logos Institucionales" class="max-h-24 object-contain" crossorigin="anonymous">
        </div>

        <header class="mb-8 text-center md:text-left flex flex-col lg:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900">Catálogo de Precios por Marca</h1>
                <p class="text-gray-600 mt-2">Filtre, busque en tiempo real, descargue o comparta reportes directamente a WhatsApp.</p>
            </div>
            
            <div id="exportButtonsContainer" class="flex flex-wrap gap-2 justify-center opacity-50 pointer-events-none transition-opacity duration-300">
                <button id="btnExportExcel" class="flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2 px-3 rounded-lg shadow-sm cursor-pointer text-xs transition-colors">
                    Descargar Excel
                </button>
                <button id="btnExportPdf" class="flex items-center gap-1.5 bg-rose-700 hover:bg-rose-800 text-white font-semibold py-2 px-3 rounded-lg shadow-sm cursor-pointer text-xs transition-colors">
                    Descargar PDF
                </button>
                
                <button id="btnShareExcel" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-3 rounded-lg shadow-sm cursor-pointer text-xs transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Compartir Excel
                </button>
                <button id="btnSharePdf" class="flex items-center gap-1.5 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2 px-3 rounded-lg shadow-sm cursor-pointer text-xs transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Compartir PDF
                </button>
            </div>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200 mb-6 flex flex-col md:flex-row gap-4">
            <div class="w-full md:w-1/3">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Filtrar por Proveedor:</label>
                <select id="proveedorSelect" class="w-full bg-white border border-gray-300 text-gray-700 py-2.5 px-4 rounded-lg focus:outline-none">
                    <option value="">Cargando proveedores...</option>
                </select>
            </div>
            <div class="w-full md:w-2/3">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Buscar Artículo:</label>
                <input type="text" id="txtBuscar" placeholder="Busca por código, marca, descripción..." class="w-full bg-white border border-gray-300 text-gray-700 py-2.5 px-4 rounded-lg focus:outline-none" />
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tablaArticulos" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-900 text-white text-sm font-semibold uppercase tracking-wider">
                            <th class="py-3 px-6">Código Art.</th>
                            <th class="py-3 px-6">Cod. Barra</th>
                            <th class="py-3 px-6">Descripción del Artículo</th>
                            <th class="py-3 px-6 text-center">Cant. (Unidades)</th>
                            <th class="py-3 px-6 text-right">Precio Final</th>
                            <th class="py-3 px-6 text-right">Precio Final Unitario</th>
                        </tr>
                    </thead>
                    <tbody id="resultadosBody" class="divide-y divide-gray-200 text-gray-700 text-sm">
                        <tr>
                            <td colspan="6" class="py-8 text-center text-gray-500 italic">Conectando con Google Sheets y descargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ENLACE CORREGIDO PARA DESCARGAR EN FORMATO CSV
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoUumCa0LO8l-KaiRrPGdqRN9KI4UG8Z2GV1NM-lKX8oTWRGqSdubUzo8DilXi3dqu4iDX762qpnL5/pub?output=csv"; 
        
        let datosCompletos = [];
        let datosFiltrados = [];

        // Al iniciar la página, se conecta al Google Sheet
        window.addEventListener('DOMContentLoaded', () => {
            cargarDatosDesdeGoogleSheets();
        });

        function cargarDatosDesdeGoogleSheets() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false, // Ahora leemos como matriz pura (arrays) para encontrar la cabecera real
                complete: function(results) {
                    const dataMatrix = results.data;
                    
                    if(!dataMatrix || dataMatrix.length === 0) {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">El documento parece estar vacío.</td></tr>`;
                        return;
                    }

                    // Buscar la fila de encabezados
                    let headerIndex = -1;
                    let headers = [];
                    for (let i = 0; i < dataMatrix.length; i++) {
                        const row = dataMatrix[i];
                        // Buscamos una fila que tenga la palabra 'Artículo' o 'Articulo'
                        if (row.some(cell => typeof cell === 'string' && cell.trim().toLowerCase().includes('artículo'))) {
                            headerIndex = i;
                            // Limpiamos los nombres de los encabezados (quitamos espacios extra)
                            headers = row.map(cell => typeof cell === 'string' ? cell.trim() : cell);
                            break;
                        }
                    }

                    if (headerIndex === -1) {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">No se encontró la fila de títulos (debe contener 'Artículo'). Revisá tu Google Sheet.</td></tr>`;
                        return;
                    }

                    // Encontramos los índices de las columnas importantes usando un sistema más flexible
                    const idxArticulo = headers.findIndex(h => h.toLowerCase().includes('artículo'));
                    const idxCodBarra = headers.findIndex(h => h.toLowerCase().includes('cod.barra') || h.toLowerCase().includes('código barras'));
                    const idxUnidades = headers.findIndex(h => h.toLowerCase().includes('unidades'));
                    const idxPrecioFinal = headers.findIndex(h => h.toLowerCase().includes('precio final') && !h.toLowerCase().includes('unitario'));
                    const idxPrecioUnitario = headers.findIndex(h => h.toLowerCase().includes('p.unitario final') || h.toLowerCase().includes('precio final unitario'));
                    const idxProveedor = headers.findIndex(h => h.toLowerCase().includes('atributo 1'));
                    const idxMarca = headers.findIndex(h => h.toLowerCase().includes('atributo 2'));
                    
                    // Buscar la descripción (generalmente la segunda 'Descripción' o 'Descripción_1')
                    let idxDescripcionArticulo = headers.findIndex(h => h === 'Descripción_1');
                    if (idxDescripcionArticulo === -1) {
                         // Si no hay Descripción_1, buscamos la segunda aparición de 'Descripción'
                         let count = 0;
                         for (let i = 0; i < headers.length; i++) {
                             if (headers[i].toLowerCase() === 'descripción' || headers[i].toLowerCase() === 'descripcion') {
                                 count++;
                                 if (count === 2) {
                                     idxDescripcionArticulo = i;
                                     break;
                                 }
                             }
                         }
                    }
                    // Respaldo final si no encuentra dos descripciones
                    if (idxDescripcionArticulo === -1) {
                        idxDescripcionArticulo = headers.findIndex(h => h.toLowerCase() === 'descripción' || h.toLowerCase() === 'descripcion');
                    }

                    // Procesar los datos (desde la fila siguiente al encabezado)
                    for (let i = headerIndex + 1; i < dataMatrix.length; i++) {
                        const row = dataMatrix[i];
                        
                        // Si la fila está vacía o no tiene el código de artículo, la salteamos
                        if (!row || row.length === 0 || !row[idxArticulo] || row[idxArticulo].toString().trim() === "") {
                            continue;
                        }

                        let marcaCelda = row[idxMarca] !== undefined ? row[idxMarca].toString().trim() : '';
                        if (marcaCelda === "") marcaCelda = "GENERAL";

                        // Extraer valores con cuidado
                        const valArticulo = row[idxArticulo];
                        const valCodBarra = row[idxCodBarra];
                        const valDesc = row[idxDescripcionArticulo];
                        const valUnidades = row[idxUnidades];
                        const valPrecioFinal = row[idxPrecioFinal];
                        const valPrecioUnitario = row[idxPrecioUnitario];
                        const valProveedor = row[idxProveedor];

                        datosCompletos.push({
                            'Artículo': valArticulo ? valArticulo.toString().trim() : '',
                            'Cod.Barra': valCodBarra ? valCodBarra.toString().trim() : '-',
                            'Descripcion_Articulo': valDesc ? valDesc.toString().trim() : 'Sin descripción',
                            'Unidades': !isNaN(parseFloat(valUnidades)) ? parseFloat(valUnidades) : 0,
                            'Precio Final': !isNaN(parseFloat(valPrecioFinal)) ? parseFloat(valPrecioFinal) : 0,
                            'P.Unitario Final': !isNaN(parseFloat(valPrecioUnitario)) ? parseFloat(valPrecioUnitario) : 0,
                            'Atributo 1': valProveedor ? valProveedor.toString().trim() : 'SIN PROVEEDOR',
                            'Marca': marcaCelda
                        });
                    }

                    if(datosCompletos.length > 0){
                        datosFiltrados = [...datosCompletos];
                        poblarProveedores(datosCompletos);
                        document.getElementById('exportButtonsContainer').classList.remove('opacity-50', 'pointer-events-none');
                    } else {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">No se procesaron productos. Comprobá que las columnas tengan los nombres correctos.</td></tr>`;
                    }
                },
                error: function(err) {
                    console.error("Error al cargar el CSV:", err);
                    document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">Error al conectar con Google Sheets. Asegurate de que el archivo esté publicado en la web.</td></tr>`;
                }
            });
        }

        function poblarProveedores(datos) {
            const select = document.getElementById('proveedorSelect');
            const proveedores = [...new Set(datos.map(item => item['Atributo 1']))].filter(p => p).sort();
            select.innerHTML = '<option value="">-- Todos los Proveedores --</option>';
            proveedores.forEach(prov => {
                const opt = document.createElement('option');
                opt.value = prov; opt.textContent = prov; select.appendChild(opt);
            });
            aplicarFiltros();
        }

        document.getElementById('proveedorSelect').addEventListener('change', aplicarFiltros);
        document.getElementById('txtBuscar').addEventListener('input', aplicarFiltros);

        function aplicarFiltros() {
            const provSel = document.getElementById('proveedorSelect').value;
            const txt = document.getElementById('txtBuscar').value.toLowerCase().trim();

            datosFiltrados = datosCompletos.filter(item => {
                const cumpleProv = (provSel === "" || item['Atributo 1'] === provSel);
                const cumpleTxt = (txt === "" || 
                    (item['Artículo'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Cod.Barra'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Marca'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Descripcion_Articulo'] || '').toString().toLowerCase().includes(txt)
                );
                return cumpleProv && cumpleTxt;
            });
            mostrarProductos(datosFiltrados);
        }

        function mostrarProductos(productos) {
            const tbody = document.getElementById('resultadosBody');
            tbody.innerHTML = '';
            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500 italic">Sin resultados.</td></tr>`;
                return;
            }

            let bMarcaActual = "";
            const productosOrdenados = [...productos].sort((a, b) => a['Marca'].localeCompare(b['Marca']));

            productosOrdenados.forEach((prod) => {
                if (prod['Marca'] !== bMarcaActual) {
                    bMarcaActual = prod['Marca'];
                    const filaMarca = document.createElement('tr');
                    filaMarca.className = "bg-slate-100 font-bold border-t border-b border-blue-200 text-blue-900 select-none";
                    filaMarca.innerHTML = `<td colspan="6" class="py-2.5 px-6 tracking-wide text-xs uppercase">MARCA: ${bMarcaActual}</td>`;
                    tbody.appendChild(filaMarca);
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 bg-white transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-6 font-mono text-gray-600">${prod['Artículo']}</td>
                    <td class="py-3 px-6 font-mono text-gray-500">${prod['Cod.Barra']}</td>
                    <td class="py-3 px-6 font-medium text-gray-900">${prod['Descripcion_Articulo']}</td>
                    <td class="text-center py-3 px-6 font-semibold text-gray-700">${prod['Unidades']}</td>
                    <td class="py-3 px-6 text-right font-semibold text-gray-900">${formatearMoneda(prod['Precio Final'])}</td>
                    <td class="py-3 px-6 text-right text-blue-700 font-semibold">${formatearMoneda(prod['P.Unitario Final'])}</td>
                `;
                tbody.appendChild(tr);
            });
            
            datosFiltrados = productosOrdenados;
        }

        function formatearMoneda(v) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
        }

        // --- FUNCIÓN MAESTRA: GENERAR CONTENIDO EXCEL ---
        function generarStringExcel() {
            const prov = document.getElementById('proveedorSelect').value || "Todos los Proveedores";
            const hoy = new Date();
            const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;
            const logoUrl = document.getElementById('logoBanner').src;

            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
