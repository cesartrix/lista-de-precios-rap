<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador de Precios por Proveedor y Marca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="container mx-auto max-w-7xl p-3 md:p-6">
        <div class="w-full flex justify-center mb-4 md:mb-6 bg-white p-3 md:p-4 rounded-xl shadow-xs border border-gray-200">
            <img id="logoBanner" src="https://i.postimg.cc/MnxJSvgf/image-dda983.jpg" alt="Logos Institucionales" class="max-h-16 md:max-h-24 object-contain" crossorigin="anonymous">
        </div>

        <header class="mb-6 md:mb-8 text-center md:text-left flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="w-full">
                <h1 class="text-2xl md:text-3xl font-bold text-blue-900 leading-tight">Catálogo de Precios</h1>
                <p class="text-sm md:text-base text-gray-600 mt-1 md:mt-2">Filtre, busque y comparta reportes a WhatsApp.</p>
            </div>
            
            <div id="exportButtonsContainer" class="w-full lg:w-auto grid grid-cols-2 md:flex md:flex-wrap gap-2 opacity-50 pointer-events-none transition-opacity duration-300">
                <button id="btnExportExcel" class="w-full flex justify-center items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    Descargar Excel
                </button>
                <button id="btnExportPdf" class="w-full flex justify-center items-center gap-1.5 bg-rose-700 hover:bg-rose-800 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    Descargar PDF
                </button>
                
                <button id="btnShareExcel" class="w-full flex justify-center items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Enviar Excel
                </button>
                <button id="btnSharePdf" class="w-full flex justify-center items-center gap-1 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Enviar PDF
                </button>
            </div>
        </header>

        <div class="bg-white p-4 md:p-6 rounded-xl shadow-xs border border-gray-200 mb-4 md:mb-6 flex flex-col md:flex-row gap-4">
            <div class="w-full md:w-1/3">
                <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1.5">Filtrar por Proveedor:</label>
                <select id="proveedorSelect" class="w-full bg-white border border-gray-300 text-gray-700 py-3 md:py-2.5 px-4 rounded-lg focus:outline-none focus:border-blue-500 text-sm appearance-none">
                    <option value="">Cargando proveedores...</option>
                </select>
            </div>
            <div class="w-full md:w-2/3">
                <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1.5">Buscar Artículo:</label>
                <input type="text" id="txtBuscar" placeholder="Ej: Código, marca, descripción..." class="w-full bg-white border border-gray-300 text-gray-700 py-3 md:py-2.5 px-4 rounded-lg focus:outline-none focus:border-blue-500 text-sm" />
            </div>
        </div>

        <div class="md:hidden text-right text-xs text-blue-600 font-medium mb-2 animate-pulse">
            👉 Deslizá la tabla para ver más
        </div>

        <div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tablaArticulos" class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-blue-900 text-white text-xs md:text-sm font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4 md:px-6">Código</th>
                            <th class="py-3 px-4 md:px-6">Cod. Barra</th>
                            <th class="py-3 px-4 md:px-6">Descripción</th>
                            <th class="py-3 px-4 md:px-6 text-center">Unidades</th>
                            <th class="py-3 px-4 md:px-6 text-right">P. Final</th>
                            <th class="py-3 px-4 md:px-6 text-right">P. Unitario</th>
                        </tr>
                    </thead>
                    <tbody id="resultadosBody" class="divide-y divide-gray-200 text-gray-700 text-xs md:text-sm">
                        <tr>
                            <td colspan="6" class="py-8 text-center text-gray-500 italic">Conectando con Google Sheets y descargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoUumCa0LO8l-KaiRrPGdqRN9KI4UG8Z2GV1NM-lKX8oTWRGqSdubUzo8DilXi3dqu4iDX762qpnL5/pub?output=csv"; 
        
        let datosCompletos = [];
        let datosFiltrados = [];

        window.addEventListener('DOMContentLoaded', () => {
            cargarDatosDesdeGoogleSheets();
        });

        function cargarDatosDesdeGoogleSheets() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false, 
                complete: function(results) {
                    const dataMatrix = results.data;
                    
                    if(!dataMatrix || dataMatrix.length === 0) {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">El documento parece estar vacío.</td></tr>`;
                        return;
                    }

                    let headerIndex = -1;
                    let headers = [];
                    for (let i = 0; i < dataMatrix.length; i++) {
                        const row = dataMatrix[i];
                        if (row.some(cell => typeof cell === 'string' && cell.trim().toLowerCase().includes('artículo'))) {
                            headerIndex = i;
                            headers = row.map(cell => typeof cell === 'string' ? cell.trim() : cell);
                            break;
                        }
                    }

                    if (headerIndex === -1) {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">No se encontró la fila de títulos.</td></tr>`;
                        return;
                    }

                    const idxArticulo = headers.findIndex(h => h.toLowerCase().includes('artículo'));
                    const idxCodBarra = headers.findIndex(h => h.toLowerCase().includes('cod.barra') || h.toLowerCase().includes('código barras'));
                    const idxUnidades = headers.findIndex(h => h.toLowerCase().includes('unidades'));
                    const idxPrecioFinal = headers.findIndex(h => h.toLowerCase().includes('precio final') && !h.toLowerCase().includes('unitario'));
                    const idxPrecioUnitario = headers.findIndex(h => h.toLowerCase().includes('p.unitario final') || h.toLowerCase().includes('precio final unitario'));
                    const idxProveedor = headers.findIndex(h => h.toLowerCase().includes('atributo 1'));
                    const idxMarca = headers.findIndex(h => h.toLowerCase().includes('atributo 2'));
                    
                    let idxDescripcionArticulo = headers.findIndex(h => h === 'Descripción_1');
                    if (idxDescripcionArticulo === -1) {
                         let count = 0;
                         for (let i = 0; i < headers.length; i++) {
                             if (headers[i].toLowerCase() === 'descripción' || headers[i].toLowerCase() === 'descripcion') {
                                 count++;
                                 if (count === 2) {
                                     idxDescripcionArticulo = i;
                                     break;
                                 }
                             }
                         }
                    }
                    if (idxDescripcionArticulo === -1) {
                        idxDescripcionArticulo = headers.findIndex(h => h.toLowerCase() === 'descripción' || h.toLowerCase() === 'descripcion');
                    }

                    for (let i = headerIndex + 1; i < dataMatrix.length; i++) {
                        const row = dataMatrix[i];
                        if (!row || row.length === 0 || !row[idxArticulo] || row[idxArticulo].toString().trim() === "") continue;

                        let marcaCelda = row[idxMarca] !== undefined ? row[idxMarca].toString().trim() : '';
                        if (marcaCelda === "") marcaCelda = "GENERAL";

                        datosCompletos.push({
                            'Artículo': row[idxArticulo] ? row[idxArticulo].toString().trim() : '',
                            'Cod.Barra': row[idxCodBarra] ? row[idxCodBarra].toString().trim() : '-',
                            'Descripcion_Articulo': row[idxDescripcionArticulo] ? row[idxDescripcionArticulo].toString().trim() : 'Sin descripción',
                            'Unidades': !isNaN(parseFloat(row[idxUnidades])) ? parseFloat(row[idxUnidades]) : 0,
                            'Precio Final': !isNaN(parseFloat(row[idxPrecioFinal])) ? parseFloat(row[idxPrecioFinal]) : 0,
                            'P.Unitario Final': !isNaN(parseFloat(row[idxPrecioUnitario])) ? parseFloat(row[idxPrecioUnitario]) : 0,
                            'Atributo 1': row[idxProveedor] ? row[idxProveedor].toString().trim() : 'SIN PROVEEDOR',
                            'Marca': marcaCelda
                        });
                    }

                    if(datosCompletos.length > 0){
                        datosFiltrados = [...datosCompletos];
                        poblarProveedores(datosCompletos);
                        document.getElementById('exportButtonsContainer').classList.remove('opacity-50', 'pointer-events-none');
                    } else {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">No se procesaron productos.</td></tr>`;
                    }
                },
                error: function(err) {
                    document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium bg-rose-50">Error de conexión con Google Sheets.</td></tr>`;
                }
            });
        }

        function poblarProveedores(datos) {
            const select = document.getElementById('proveedorSelect');
            const proveedores = [...new Set(datos.map(item => item['Atributo 1']))].filter(p => p).sort();
            select.innerHTML = '<option value="">-- Todos los Proveedores --</option>';
            proveedores.forEach(prov => {
                const opt = document.createElement('option');
                opt.value = prov; opt.textContent = prov; select.appendChild(opt);
            });
            aplicarFiltros();
        }

        document.getElementById('proveedorSelect').addEventListener('change', aplicarFiltros);
        document.getElementById('txtBuscar').addEventListener('input', aplicarFiltros);

        function aplicarFiltros() {
            const provSel = document.getElementById('proveedorSelect').value;
            const txt = document.getElementById('txtBuscar').value.toLowerCase().trim();

            datosFiltrados = datosCompletos.filter(item => {
                const cumpleProv = (provSel === "" || item['Atributo 1'] === provSel);
                const cumpleTxt = (txt === "" || 
                    (item['Artículo'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Cod.Barra'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Marca'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Descripcion_Articulo'] || '').toString().toLowerCase().includes(txt)
                );
                return cumpleProv && cumpleTxt;
            });
            mostrarProductos(datosFiltrados);
        }

        function mostrarProductos(productos) {
            const tbody = document.getElementById('resultadosBody');
            tbody.innerHTML = '';
            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500 italic">Sin resultados.</td></tr>`;
                return;
            }

            let bMarcaActual = "";
            const productosOrdenados = [...productos].sort((a, b) => a['Marca'].localeCompare(b['Marca']));

            productosOrdenados.forEach((prod) => {
                if (prod['Marca'] !== bMarcaActual) {
                    bMarcaActual = prod['Marca'];
                    const filaMarca = document.createElement('tr');
                    filaMarca.className = "bg-slate-100 font-bold border-t border-b border-blue-200 text-blue-900 select-none";
                    filaMarca.innerHTML = `<td colspan="6" class="py-2.5 px-4 md:px-6 tracking-wide text-[10px] md:text-xs uppercase">MARCA: ${bMarcaActual}</td>`;
                    tbody.appendChild(filaMarca);
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 bg-white transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 md:px-6 font-mono text-gray-600">${prod['Artículo']}</td>
                    <td class="py-3 px-4 md:px-6 font-mono text-gray-500">${prod['Cod.Barra']}</td>
                    <td class="py-3 px-4 md:px-6 font-medium text-gray-900">${prod['Descripcion_Articulo']}</td>
                    <td class="text-center py-3 px-4 md:px-6 font-semibold text-gray-700">${prod['Unidades']}</td>
                    <td class="py-3 px-4 md:px-6 text-right font-semibold text-gray-900 whitespace-nowrap">${formatearMoneda(prod['Precio Final'])}</td>
                    <td class="py-3 px-4 md:px-6 text-right text-blue-700 font-semibold whitespace-nowrap">${formatearMoneda(prod['P.Unitario Final'])}</td>
                `;
                tbody.appendChild(tr);
            });
            
            datosFiltrados = productosOrdenados;
        }

        function formatearMoneda(v) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
        }

        // --- FUNCIÓN MAESTRA: GENERAR EXCEL ---
        function generarStringExcel() {
            const prov = document.getElementById('proveedorSelect').value || "Todos los Proveedores";
            const hoy = new Date();
            const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;
            const logoUrl = document.getElementById('logoBanner').src;

            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="UTF-8"><style>
                body { font-family: sans-serif; }
                table { border-collapse: collapse; }
                th { background-color: #1e3a8a; color: #ffffff; font-weight: bold; border: 1px solid #0f172a; padding: 6px; text-align: center; }
                td { border: 1px solid #cbd5e1; padding: 5px; font-size: 10pt; }
                .row-marca { background-color: #f1f5f9; font-weight: bold; color: #1e3a8a; }
                .text-center { text-align: center; }
                .text-right { text-align: right; }
                .font-mono { font-family: monospace; }
            </style></head>
            <body>
                <table>
                    <tr>
                        <td colspan="3" style="border:none; height:70px; valign:middle;"><img src="${logoUrl}" width="220" height="65"></td>
                        <td colspan="3" style="border:none; valign:middle;">
                            <span style="font-size:16pt; font-weight:bold; color:#1e3a8a;">REPORTE DE PRECIOS</span><br>
                            <span><strong>Proveedor:</strong> ${prov}</span><br>
                            <span><strong>Fecha:</strong> ${fechaStr}</span>
                        </td>
                    </tr>
                    <tr style="height:15px;"><td colspan="6" style="border:none;"></td></tr>
                </table>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 140px;">Marca</th><th style="width: 90px;">Código Art.</th><th style="width: 120px;">Cod. Barra</th><th style="width: 300px;">Descripción del Artículo</th><th style="width: 80px;">U. (Cant)</th><th style="width: 110px;">Precio Final</th><th style="width: 120px;">P. Final Unitario</th>
                        </tr>
                    </thead>
                    <tbody>`;
            datosFiltrados.forEach(p => {
                html += `<tr>
                    <td class="row-marca">${p['Marca']}</td><td class="font-mono text-center">${p['Artículo']}</td><td class="font-mono text-center" style="mso-number-format:'\\@';">${p['Cod.Barra']}</td><td>${p['Descripcion_Articulo']}</td><td class="text-center">${p['Unidades']}</td><td class="text-right">${formatearMoneda(p['Precio Final'])}</td><td class="text-right" style="font-weight:bold; color:#1e3a8a;">${formatearMoneda(p['P.Unitario Final'])}</td>
                </tr>`;
            });
            html += `</tbody></table></body></html>`;
            return html;
        }

        // --- FUNCIÓN MAESTRA: GENERAR PDF ---
        function generarDocumentoPdf() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const prov = document.getElementById('proveedorSelect').value || "Todos los Proveedores";
            const filas = datosFiltrados.map(p => [p['Marca'], p['Artículo'], p['Cod.Barra'], p['Descripcion_Articulo'], p['Unidades'], formatearMoneda(p['Precio Final']), formatearMoneda(p['P.Unitario Final'])]);

            doc.autoTable({
                startY: 130,
                head: [['Marca', 'Código Art.', 'Cod. Barra', 'Descripción del Artículo', 'Cant.', 'Precio Final', 'Precio Final Unitario']],
                body: filas,
                theme: 'striped',
                headStyles: { fillColor: [30, 58, 138] },
                columnStyles: { 0: {cellWidth:80}, 1: {cellWidth:55}, 2: {cellWidth:75}, 3: {cellWidth:'auto'}, 4: {halign:'center', cellWidth:35}, 5: {halign:'right', cellWidth:70}, 6: {halign:'right', cellWidth:80} },
                margin: { top: 130, left: 35, right: 35 },
                didDrawPage: function(data) {
                    try { doc.addImage(document.getElementById('logoBanner'), 'JPEG', 35, 20, 240, 72); } catch (e) {}
                    doc.setFontSize(10); doc.setTextColor(71, 85, 105);
                    doc.text(`Proveedor: ${prov}`, 330, 50);
                    const h = new Date(); doc.text(`Fecha: ${h.getDate()}/${h.getMonth()+1}/${h.getFullYear()}`, 330, 65);
                    doc.text(`Página ${data.pageNumber}`, 330, 80);
                    doc.line(35, 105, 560, 105);
                }
            });
            return doc;
        }

        // --- ACCIONES DE BOTONES ---
        document.getElementById('btnExportExcel').addEventListener('click', () => {
            if (datosFiltrados.length === 0) return;
            const blob = new Blob([generarStringExcel()], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Precios_${(document.getElementById('proveedorSelect').value || "Todos").replace(/[^a-z0-9]/gi, '_')}.xls`;
            a.click();
        });

        document.getElementById('btnExportPdf').addEventListener('click', () => {
            if (datosFiltrados.length === 0) return;
            generarDocumentoPdf().save(`Precios_${(document.getElementById('proveedorSelect').value || "Todos").replace(/[^a-z0-9]/gi, '_')}.pdf`);
        });

        document.getElementById('btnShareExcel').addEventListener('click', async () => {
            if (datosFiltrados.length === 0) return;
            if (!navigator.share) { alert("Tu dispositivo no soporta compartir nativamente."); return; }
            const archivo = new File([new Blob([generarStringExcel()], { type: 'application/vnd.ms-excel' })], `Precios_${(document.getElementById('proveedorSelect').value || "Todos").replace(/[^a-z0-9]/gi, '_')}.xls`, { type: 'application/vnd.ms-excel' });
            try { await navigator.share({ files: [archivo], title: 'Precios', text: 'Catálogo de Precios.' }); } catch (e) {}
        });

        document.getElementById('btnSharePdf').addEventListener('click', async () => {
            if (datosFiltrados.length === 0) return;
            if (!navigator.share) { alert("Tu dispositivo no soporta compartir nativamente."); return; }
            const archivo = new File([generarDocumentoPdf().output('blob')], `Precios_${(document.getElementById('proveedorSelect').value || "Todos").replace(/[^a-z0-9]/gi, '_')}.pdf`, { type: 'application/pdf' });
            try { await navigator.share({ files: [archivo], title: 'Precios PDF', text: 'Catálogo de Precios PDF.' }); } catch (e) {}
        });
    </script>
</body>
</html>
