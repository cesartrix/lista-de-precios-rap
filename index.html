<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador de Precios por Proveedor y Marca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="container mx-auto max-w-7xl p-3 md:p-6">
        <div class="w-full flex justify-center mb-4 md:mb-6 bg-white p-3 md:p-4 rounded-xl shadow-xs border border-gray-200">
            <img id="logoBanner" src="https://i.postimg.cc/MnxJSvgf/image-dda983.jpg" alt="Logos Institucionales" class="max-h-16 md:max-h-24 object-contain" crossorigin="anonymous">
        </div>

        <header class="mb-6 md:mb-8 text-center md:text-left flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="w-full">
                <h1 class="text-2xl md:text-3xl font-bold text-blue-900 leading-tight">Catálogo de Precios</h1>
                <p class="text-sm md:text-base text-gray-600 mt-1 md:mt-2">Filtre, busque y comparta reportes a WhatsApp.</p>
            </div>
            
            <div id="exportButtonsContainer" class="w-full lg:w-auto grid grid-cols-2 md:flex md:flex-wrap gap-2 opacity-50 pointer-events-none transition-opacity duration-300">
                <button id="btnExportExcel" class="w-full flex justify-center items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    Descargar Excel
                </button>
                <button id="btnExportPdf" class="w-full flex justify-center items-center gap-1.5 bg-rose-700 hover:bg-rose-800 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    Descargar PDF
                </button>
                <button id="btnShareExcel" class="w-full flex justify-center items-center gap-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Enviar Excel
                </button>
                <button id="btnSharePdf" class="w-full flex justify-center items-center gap-1 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-2.5 px-3 rounded-lg shadow-sm cursor-pointer text-xs md:text-sm transition-colors active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.632-2.316m0 0a3 3 0 102.684-2.684 3 3 0 00-2.684 2.684zm-4.632 2.316m0 0a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0 0L13.316 15.316"></path></svg>
                    Enviar PDF
                </button>
            </div>
        </header>

        <div class="bg-white p-4 md:p-6 rounded-xl shadow-xs border border-gray-200 mb-4 md:mb-6 flex flex-col md:flex-row gap-4">
            <div class="w-full md:w-1/3">
                <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1.5">Filtrar por Proveedor:</label>
                <input type="text" id="proveedorInput" list="listaProveedores" placeholder="Todos los proveedores (Escriba para buscar)" class="w-full bg-gray-50 border border-gray-300 text-gray-700 py-3 md:py-2.5 px-4 rounded-lg focus:outline-none focus:border-blue-500 text-sm" autocomplete="off">
                <datalist id="listaProveedores"></datalist>
            </div>
            <div class="w-full md:w-1/3">
                <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1.5">Filtrar por Marca:</label>
                <input type="text" id="marcaInput" list="listaMarcas" placeholder="Todas las marcas (Escriba para buscar)" class="w-full bg-gray-50 border border-gray-300 text-gray-700 py-3 md:py-2.5 px-4 rounded-lg focus:outline-none focus:border-blue-500 text-sm" autocomplete="off" disabled>
                <datalist id="listaMarcas"></datalist>
            </div>
            <div class="w-full md:w-1/3">
                <label class="block text-xs md:text-sm font-semibold text-gray-700 mb-1.5">Buscar Artículo:</label>
                <input type="text" id="txtBuscar" placeholder="Ej: Código, descripción..." class="w-full bg-white border border-gray-300 text-gray-700 py-3 md:py-2.5 px-4 rounded-lg focus:outline-none focus:border-blue-500 text-sm" autocomplete="off" />
            </div>
        </div>

        <div class="md:hidden text-right text-xs text-blue-600 font-medium mb-2 animate-pulse">
            👉 Deslizá la tabla para ver más
        </div>

        <div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="tablaArticulos" class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-blue-900 text-white text-xs md:text-sm font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4 md:px-6">Código</th>
                            <th class="py-3 px-4 md:px-6">Cod. Barra</th>
                            <th class="py-3 px-4 md:px-6">Descripción</th>
                            <th class="py-3 px-4 md:px-6 text-center">Unidades x Bulto</th>
                            <th class="py-3 px-4 md:px-6 text-right">P. Neto Unidad</th>
                            <th class="py-3 px-4 md:px-6 text-right">P. Unitario</th>
                        </tr>
                    </thead>
                    <tbody id="resultadosBody" class="divide-y divide-gray-200 text-gray-700 text-xs md:text-sm">
                        <tr>
                            <td colspan="6" id="loadingText" class="py-8 text-center text-gray-500 italic">Conectando con Google Sheets y descargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ENLACE_NORMAL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/1Z04LsDjYnu7Gk6UMIYTlQloIskmd5yvhfw0AhoiBE4o/edit?gid=0#gid=0"; 
        
        let datosCompletos = [];
        let datosFiltrados = [];

        window.addEventListener('DOMContentLoaded', () => {
            cargarDatosDesdeGoogleSheets();
        });

        function obtenerUrlApi(urlOriginal) {
            const match = urlOriginal.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) {
                return `https://docs.google.com/spreadsheets/d/${match[1]}/gviz/tq?tqx=out:csv`;
            }
            return urlOriginal;
        }

        const safeString = (val) => {
            if (val && typeof val === 'string') return val.toLowerCase().trim();
            return '';
        };

        function cargarDatosDesdeGoogleSheets() {
            const urlFinalApi = obtenerUrlApi(ENLACE_NORMAL_GOOGLE_SHEETS);

            Papa.parse(urlFinalApi, {
                download: true,
                header: false, 
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const dataMatrix = results.data;
                        
                        if(!dataMatrix || dataMatrix.length === 0) {
                            document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">El documento parece estar vacío.</td></tr>`;
                            return;
                        }

                        let headerIndex = -1;
                        let headers = [];
                        for (let i = 0; i < dataMatrix.length; i++) {
                            const row = dataMatrix[i];
                            if (row.some(cell => safeString(cell).includes('artículo') || safeString(cell).includes('articulo'))) {
                                headerIndex = i;
                                headers = row.map(cell => typeof cell === 'string' ? cell.trim() : cell);
                                break;
                            }
                        }

                        if (headerIndex === -1) {
                            document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">
                                Error: No se encontró la cabecera "Artículo".<br>
                                <span class="text-xs text-gray-500 mt-2 block">Verificá que el enlace copiado sea correcto y que tu Excel tenga títulos.</span>
                            </td></tr>`;
                            return;
                        }

                        const idxArticulo = headers.findIndex(h => safeString(h).includes('artículo') || safeString(h).includes('articulo'));
                        const idxCodBarra = headers.findIndex(h => safeString(h).includes('cod.barra') || safeString(h).includes('código barras'));
                        const idxUnidades = headers.findIndex(h => safeString(h).includes('unidades'));
                        const idxPrecioBase = headers.findIndex(h => safeString(h).includes('precio base'));
                        const idxPrecioUnitario = headers.findIndex(h => safeString(h).includes('p.unitario final') || safeString(h).includes('precio final unitario'));
                        const idxProveedor = headers.findIndex(h => safeString(h).includes('atributo 1'));
                        const idxMarca = headers.findIndex(h => safeString(h).includes('atributo 2'));
                        
                        if (idxPrecioBase === -1) {
                            document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">
                                Error: No se encontró la cabecera "Precio Base".<br>
                                <span class="text-xs text-gray-500 mt-2 block">Asegurate de que exista la columna "Precio Base" en tu Google Sheets.</span>
                            </td></tr>`;
                            return;
                        }

                        let idxDescripcionArticulo = headers.findIndex(h => safeString(h) === 'descripción_1' || safeString(h) === 'descripcion_1');
                        if (idxDescripcionArticulo === -1) {
                            let count = 0;
                            for (let i = 0; i < headers.length; i++) {
                                let val = safeString(headers[i]);
                                if (val === 'descripción' || val === 'descripcion') {
                                    count++;
                                    if (count === 2) {
                                        idxDescripcionArticulo = i;
                                        break;
                                    }
                                }
                            }
                        }
                        if (idxDescripcionArticulo === -1) {
                            idxDescripcionArticulo = headers.findIndex(h => safeString(h) === 'descripción' || safeString(h) === 'descripcion');
                        }

                        for (let i = headerIndex + 1; i < dataMatrix.length; i++) {
                            const row = dataMatrix[i];
                            if (!row || row.length === 0 || row[idxArticulo] === undefined || row[idxArticulo] === null || row[idxArticulo].toString().trim() === "") continue;

                            let marcaCelda = row[idxMarca] !== undefined && row[idxMarca] !== null ? row[idxMarca].toString().trim() : '';
                            if (marcaCelda === "") marcaCelda = "GENERAL";

                            let unidadesBulto = !isNaN(parseFloat(row[idxUnidades])) ? parseFloat(row[idxUnidades]) : 0;
                            let precioBaseVal = !isNaN(parseFloat(row[idxPrecioBase])) ? parseFloat(row[idxPrecioBase]) : 0;
                            
                            let precioNetoUnidadVal = unidadesBulto > 0 ? (precioBaseVal / unidadesBulto) : 0;

                            datosCompletos.push({
                                'Artículo': row[idxArticulo] !== null ? row[idxArticulo].toString().trim() : '',
                                'Cod.Barra': row[idxCodBarra] !== undefined && row[idxCodBarra] !== null && row[idxCodBarra] !== "" ? row[idxCodBarra].toString().trim() : '-',
                                'Descripcion_Articulo': row[idxDescripcionArticulo] !== undefined && row[idxDescripcionArticulo] !== null ? row[idxDescripcionArticulo].toString().trim() : 'Sin descripción',
                                'Unidades': unidadesBulto,
                                'Precio Neto Unidad': precioNetoUnidadVal,
                                'P.Unitario Final': !isNaN(parseFloat(row[idxPrecioUnitario])) ? parseFloat(row[idxPrecioUnitario]) : 0,
                                'Atributo 1': row[idxProveedor] !== undefined && row[idxProveedor] !== null && row[idxProveedor] !== "" ? row[idxProveedor].toString().trim() : 'SIN PROVEEDOR',
                                'Marca': marcaCelda
                            });
                        }

                        if(datosCompletos.length > 0){
                            datosFiltrados = [...datosCompletos];
                            poblarProveedores(datosCompletos);
                            document.getElementById('exportButtonsContainer').classList.remove('opacity-50', 'pointer-events-none');
                        } else {
                            document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">No se detectaron productos en tu planilla.</td></tr>`;
                        }

                    } catch (errorInterno) {
                        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">Error procesando los datos: ${errorInterno.message}</td></tr>`;
                    }
                },
                error: function(err) {
                    document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-600 font-medium">Error de conexión con Google Sheets. Verificá que el enlace copiado sea correcto.</td></tr>`;
                }
            });
        }

        function poblarProveedores(datos) {
            const datalist = document.getElementById('listaProveedores');
            const proveedores = [...new Set(datos.map(item => item['Atributo 1']))]
                .filter(p => p && p.trim() !== '' && p.toUpperCase() !== 'SIN PROVEEDOR')
                .sort();
            
            datalist.innerHTML = '';
            proveedores.forEach(prov => {
                const opt = document.createElement('option');
                opt.value = prov; 
                datalist.appendChild(opt);
            });
            
            poblarMarcas("");
            aplicarFiltros();
        }

        function poblarMarcas(proveedorSeleccionado) {
            const datalist = document.getElementById('listaMarcas');
            const inputMarca = document.getElementById('marcaInput');
            datalist.innerHTML = '';
            
            let datosParaMarcas = datosCompletos;
            if (proveedorSeleccionado !== "") {
                datosParaMarcas = datosCompletos.filter(item => (item['Atributo 1'] || '').toLowerCase().includes(proveedorSeleccionado.toLowerCase()));
            }

            const marcas = [...new Set(datosParaMarcas.map(item => item['Marca']))].filter(m => m).sort();
            
            marcas.forEach(marca => {
                const opt = document.createElement('option');
                opt.value = marca; 
                datalist.appendChild(opt);
            });
            
            inputMarca.disabled = false;
        }

        document.getElementById('proveedorInput').addEventListener('input', () => {
            poblarMarcas(document.getElementById('proveedorInput').value.trim());
            document.getElementById('marcaInput').value = "";
            aplicarFiltros();
        });
        
        document.getElementById('marcaInput').addEventListener('input', aplicarFiltros);
        document.getElementById('txtBuscar').addEventListener('input', aplicarFiltros);

        function aplicarFiltros() {
            const provSel = document.getElementById('proveedorInput').value.toLowerCase().trim();
            const marcaSel = document.getElementById('marcaInput').value.toLowerCase().trim();
            const txt = document.getElementById('txtBuscar').value.toLowerCase().trim();

            datosFiltrados = datosCompletos.filter(item => {
                const cumpleProv = (provSel === "" || (item['Atributo 1'] || '').toLowerCase().includes(provSel));
                const cumpleMarca = (marcaSel === "" || (item['Marca'] || '').toLowerCase().includes(marcaSel));
                const cumpleTxt = (txt === "" || 
                    (item['Artículo'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Cod.Barra'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Marca'] || '').toString().toLowerCase().includes(txt) ||
                    (item['Descripcion_Articulo'] || '').toString().toLowerCase().includes(txt)
                );
                return cumpleProv && cumpleMarca && cumpleTxt;
            });
            mostrarProductos(datosFiltrados);
        }

        function mostrarProductos(productos) {
            const tbody = document.getElementById('resultadosBody');
            tbody.innerHTML = '';
            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500 italic">No se encontraron artículos.</td></tr>`;
                return;
            }

            let bMarcaActual = "";
            const productosOrdenados = [...productos].sort((a, b) => a['Marca'].localeCompare(b['Marca']));

            productosOrdenados.forEach((prod) => {
                if (prod['Marca'] !== bMarcaActual) {
                    bMarcaActual = prod['Marca'];
                    const filaMarca = document.createElement('tr');
                    filaMarca.className = "bg-slate-100 font-bold border-t border-b border-blue-200 text-blue-900 select-none";
                    filaMarca.innerHTML = `<td colspan="6" class="py-2.5 px-4 md:px-6 tracking-wide text-[10px] md:text-xs uppercase">MARCA: ${bMarcaActual}</td>`;
                    tbody.appendChild(filaMarca);
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 bg-white transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 md:px-6 font-mono text-gray-600">${prod['Artículo']}</td>
                    <td class="py-3 px-4 md:px-6 font-mono text-gray-500">${prod['Cod.Barra']}</td>
                    <td class="py-3 px-4 md:px-6 font-medium text-gray-900">${prod['Descripcion_Articulo']}</td>
                    <td class="text-center py-3 px-4 md:px-6 font-semibold text-gray-700">${prod['Unidades']}</td>
                    <td class="py-3 px-4 md:px-6 text-right font-semibold text-gray-900 whitespace-nowrap">${formatearMoneda(prod['Precio Neto Unidad'])}</td>
                    <td class="py-3 px-4 md:px-6 text-right text-blue-700 font-semibold whitespace-nowrap">${formatearMoneda(prod['P.Unitario Final'])}</td>
                `;
                tbody.appendChild(tr);
            });
            
            datosFiltrados = productosOrdenados;
        }

        function formatearMoneda(v) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
        }

        function generarWorkbookExcel() {
            // Obtenemos la marca elegida o mostramos un texto por defecto
            const marca = document.getElementById('marcaInput').value || "Todas las Marcas";
            const hoy = new Date();
            const fechaStr = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;

            const aoa = [];
            aoa.push(['REPORTE DE PRECIOS']);
            aoa.push([`Marcas: ${marca}`]);
            aoa.push([`Fecha: ${fechaStr}`]);
            aoa.push([]);
            aoa.push(['Marca', 'Código Art.', 'Cod. Barra', 'Descripción del Artículo', 'Unidades x Bulto', 'P. Neto Unidad', 'P. Final Unitario']);

            const filaEncabezado = aoa.length - 1; // índice (0-based) de la fila de encabezados

            datosFiltrados.forEach(p => {
                aoa.push([
                    p['Marca'],
                    p['Artículo'],
                    p['Cod.Barra'],
                    p['Descripcion_Articulo'],
                    p['Unidades'],
                    Number((p['Precio Neto Unidad'] || 0).toFixed(2)),
                    Number((p['P.Unitario Final'] || 0).toFixed(2))
                ]);
            });

            aoa.push([]);
            aoa.push(['Consulta con tu vendedor por acciones comerciales.']);
            aoa.push(['Los precios están sujetos a cambios sin previo aviso.']);

            const ws = XLSX.utils.aoa_to_sheet(aoa);

            // Anchos de columna
            ws['!cols'] = [
                { wch: 22 }, { wch: 12 }, { wch: 16 }, { wch: 45 }, { wch: 14 }, { wch: 14 }, { wch: 16 }
            ];

            // Combinar celdas de título / pie
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } },
                { s: { r: 2, c: 0 }, e: { r: 2, c: 6 } },
                { s: { r: aoa.length - 2, c: 0 }, e: { r: aoa.length - 2, c: 6 } },
                { s: { r: aoa.length - 1, c: 0 }, e: { r: aoa.length - 1, c: 6 } }
            ];

            // Formato moneda para las columnas de precios
            for (let r = filaEncabezado + 1; r <= filaEncabezado + datosFiltrados.length; r++) {
                ['F', 'G'].forEach(col => {
                    const cellRef = `${col}${r + 1}`;
                    if (ws[cellRef]) ws[cellRef].z = '"$"#,##0.00';
                });
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Precios");
            return wb;
        }

        function generarDocumentoPdf() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            // Cambiamos a Marcas
            const marca = document.getElementById('marcaInput').value || "Todas las Marcas";
            const filas = datosFiltrados.map(p => [p['Marca'], p['Artículo'], p['Cod.Barra'], p['Descripcion_Articulo'], p['Unidades'], formatearMoneda(p['Precio Neto Unidad']), formatearMoneda(p['P.Unitario Final'])]);

            doc.autoTable({
                startY: 130,
                head: [['Marca', 'Código Art.', 'Cod. Barra', 'Descripción del Artículo', 'U. x Bulto', 'P. Neto Unidad', 'Precio Final Unitario']],
                body: filas,
                theme: 'striped',
                headStyles: { fillColor: [30, 58, 138] },
                columnStyles: { 0: {cellWidth:80}, 1: {cellWidth:55}, 2: {cellWidth:75}, 3: {cellWidth:'auto'}, 4: {halign:'center', cellWidth:45}, 5: {halign:'right', cellWidth:70}, 6: {halign:'right', cellWidth:80} },
                // Añadimos margen bottom para dar espacio a las leyendas y que la tabla no se superponga
                margin: { top: 130, left: 35, right: 35, bottom: 65 }, 
                didDrawPage: function(data) {
                    // --- HEADER ---
                    try { doc.addImage(document.getElementById('logoBanner'), 'JPEG', 35, 20, 240, 72); } catch (e) {}
                    doc.setFontSize(10); doc.setTextColor(71, 85, 105);
                    doc.text(`Marcas: ${marca}`, 330, 50);
                    const h = new Date(); doc.text(`Fecha: ${h.getDate()}/${h.getMonth()+1}/${h.getFullYear()}`, 330, 65);
                    doc.text(`Página ${data.pageNumber}`, 330, 80);
                    doc.line(35, 105, 560, 105);

                    // --- FOOTER (Se repite en cada página) ---
                    const pageHeight = doc.internal.pageSize.height || doc.internal.pageSize.getHeight();
                    const pageWidth = doc.internal.pageSize.width || doc.internal.pageSize.getWidth();
                    
                    doc.setFontSize(11);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(30, 58, 138); // Azul oscuro para que haga juego con el diseño
                    doc.text("Consulta con tu vendedor por acciones comerciales.", pageWidth / 2, pageHeight - 40, { align: 'center' });
                    doc.text("Los precios están sujetos a cambios sin previo aviso.", pageWidth / 2, pageHeight - 25, { align: 'center' });
                }
            });
            return doc;
        }

        document.getElementById('btnExportExcel').addEventListener('click', () => {
            if (datosFiltrados.length === 0) return;
            const wb = generarWorkbookExcel();
            // El nombre del archivo ahora basa su nombre en el filtro (para que no diga vacío si solo filtras marca)
            const nombreArchivo = (document.getElementById('marcaInput').value || document.getElementById('proveedorInput').value || "Todas").replace(/[^a-z0-9]/gi, '_');
            XLSX.writeFile(wb, `Precios_${nombreArchivo}.xlsx`);
        });

        document.getElementById('btnExportPdf').addEventListener('click', () => {
            if (datosFiltrados.length === 0) return;
            const nombreArchivo = (document.getElementById('marcaInput').value || document.getElementById('proveedorInput').value || "Todas").replace(/[^a-z0-9]/gi, '_');
            generarDocumentoPdf().save(`Precios_${nombreArchivo}.pdf`);
        });

        document.getElementById('btnShareExcel').addEventListener('click', async () => {
            if (datosFiltrados.length === 0) return;
            const nombreArchivo = (document.getElementById('marcaInput').value || document.getElementById('proveedorInput').value || "Todas").replace(/[^a-z0-9]/gi, '_');
            const wb = generarWorkbookExcel();
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const archivo = new File(
                [wbout],
                `Precios_${nombreArchivo}.xlsx`,
                { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }
            );

            if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
                try {
                    await navigator.share({ files: [archivo], title: 'Precios', text: 'Catálogo de Precios.' });
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        alert('No se pudo compartir el archivo. Se descargará en su lugar.');
                        XLSX.writeFile(wb, `Precios_${nombreArchivo}.xlsx`);
                    }
                }
            } else {
                alert("Este dispositivo no admite compartir archivos directamente. Se descargará el Excel.");
                XLSX.writeFile(wb, `Precios_${nombreArchivo}.xlsx`);
            }
        });

        document.getElementById('btnSharePdf').addEventListener('click', async () => {
            if (datosFiltrados.length === 0) return;
            if (!navigator.share) { alert("Compartir directo no compatible, usá descargar."); return; }
            const nombreArchivo = (document.getElementById('marcaInput').value || document.getElementById('proveedorInput').value || "Todas").replace(/[^a-z0-9]/gi, '_');
            const archivo = new File([generarDocumentoPdf().output('blob')], `Precios_${nombreArchivo}.pdf`, { type: 'application/pdf' });
            try { await navigator.share({ files: [archivo], title: 'Precios PDF', text: 'Catálogo de Precios PDF.' }); } catch (e) {}
        });
    </script>
</body>
</html>
