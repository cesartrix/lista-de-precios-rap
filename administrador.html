<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Carga de Precios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 max-w-lg w-full m-4">
        <div class="flex justify-center mb-6">
            <img src="https://i.postimg.cc/MnxJSvgf/image-dda983.jpg" alt="Logo" class="max-h-16 object-contain">
        </div>
        
        <h1 class="text-2xl font-bold text-center text-blue-900 mb-2">Administrador de Catálogo</h1>
        <p class="text-gray-500 text-center text-sm mb-6">Sube el archivo maestro (.xlsx) para actualizar precios y marcas en la lista pública.</p>

        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 bg-gray-50 text-center hover:border-blue-500 transition-colors">
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" />
            <label for="excelFile" class="cursor-pointer block">
                <svg class="w-12 h-12 mx-auto text-blue-900 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span class="bg-blue-900 text-white font-semibold py-2.5 px-5 rounded-lg shadow-xs inline-block hover:bg-blue-800 transition-colors">
                    Seleccionar Archivo Excel
                </span>
                <p id="fileName" class="text-xs text-gray-500 mt-3 italic">Ningún archivo seleccionado</p>
            </label>
        </div>

        <div id="statusMessage" class="mt-6 text-center text-sm font-medium hidden"></div>

        <div class="mt-8 pt-4 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400">
            <span>Estado del sistema: En línea</span>
            <a href="lista_precios.html" class="text-blue-600 hover:underline font-semibold flex items-center gap-1">
                Ir a la Lista de Precios 
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileName').textContent = file.name;
            const msg = document.getElementById('statusMessage');
            
            msg.className = "mt-6 text-center text-sm font-medium text-blue-700 bg-blue-50 p-3 rounded-lg border border-blue-200 animate-pulse";
            msg.textContent = "Procesando Excel y agrupando marcas de forma segura...";
            msg.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const filasPuras = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    const encabezados = filasPuras[1]; // Fila de títulos reales
                    
                    if (!encabezados) {
                        throw new Error("No se pudo leer la estructura de columnas del Excel.");
                    }

                    const idxArticulo = encabezados.indexOf("Artículo");
                    const idxCodBarra = encabezados.indexOf("Cod.Barra");
                    const idxUnidades = encabezados.indexOf("Unidades");
                    const idxPrecioFinal = encabezados.indexOf("Precio Final");
                    const idxPrecioUnitario = encabezados.indexOf("P.Unitario Final");
                    const idxProveedor = encabezados.indexOf("Atributo 1");
                    const idxMarca = encabezados.indexOf("Atributo 2"); // Fila AB (Marcas)
                    
                    let conteoDesc = 0;
                    let idxDescripcionArticulo = -1;
                    for (let i = 0; i < encabezados.length; i++) {
                        if (encabezados[i] === "Descripción") {
                            conteoDesc++;
                            if (conteoDesc === 2) {
                                idxDescripcionArticulo = i;
                                break;
                            }
                        }
                    }
                    if (idxDescripcionArticulo === -1) idxDescripcionArticulo = encabezados.indexOf("Descripción");

                    const datosNormalizados = [];

                    for (let f = 2; f < filasPuras.length; f++) {
                        const filaActual = filasPuras[f];
                        if (!filaActual || filaActual.length === 0) continue;

                        const valArticulo = filaActual[idxArticulo];
                        if (valArticulo === undefined || valArticulo === null || valArticulo.toString().trim() === "") {
                            continue;
                        }

                        // Extraemos la marca (Columna AB), si viene vacía le asignamos "GENERAL"
                        let marcaCelda = filaActual[idxMarca] !== undefined ? filaActual[idxMarca].toString().trim() : '';
                        if (marcaCelda === "") marcaCelda = "GENERAL";

                        datosNormalizados.push({
                            'Artículo': valArticulo.toString().trim(),
                            'Cod.Barra': filaActual[idxCodBarra] !== undefined && filaActual[idxCodBarra] !== "" ? filaActual[idxCodBarra].toString().trim() : '-',
                            'Descripcion_Articulo': filaActual[idxDescripcionArticulo] !== undefined ? filaActual[idxDescripcionArticulo].toString().trim() : 'Sin descripción',
                            'Unidades': !isNaN(parseFloat(filaActual[idxUnidades])) ? parseFloat(filaActual[idxUnidades]) : 0,
                            'Precio Final': !isNaN(parseFloat(filaActual[idxPrecioFinal])) ? parseFloat(filaActual[idxPrecioFinal]) : 0,
                            'P.Unitario Final': !isNaN(parseFloat(filaActual[idxPrecioUnitario])) ? parseFloat(filaActual[idxPrecioUnitario]) : 0,
                            'Atributo 1': filaActual[idxProveedor] !== undefined && filaActual[idxProveedor] !== "" ? filaActual[idxProveedor].toString().trim() : 'SIN PROVEEDOR',
                            'Marca': marcaCelda
                        });
                    }

                    if (datosNormalizados.length === 0) {
                        throw new Error("No se encontraron registros válidos.");
                    }

                    localStorage.setItem('base_precios_data', JSON.stringify(datosNormalizados));

                    msg.className = "mt-6 text-center text-sm font-medium text-emerald-700 bg-emerald-50 p-3 rounded-lg border border-emerald-200";
                    msg.innerHTML = `<strong>¡Sincronización Exitosa!</strong><br><span class="text-xs text-emerald-600">${datosNormalizados.length} artículos indexados con sus marcas.</span>`;

                } catch (error) {
                    console.error(error);
                    msg.className = "mt-6 text-center text-sm font-medium text-rose-700 bg-rose-50 p-3 rounded-lg border border-rose-200";
                    msg.textContent = "Error: " + error.message;
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
